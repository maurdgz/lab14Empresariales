name: Build and Deploy .NET Application
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - name: Publish application
        run: dotnet publish Lab14_MauricioRdgz/Lab14_MauricioRdgz.csproj -c Release --no-build -o published
      - name: Test published API
        run: |
          dotnet published/Lab14_MauricioRdgz.dll --urls http://127.0.0.1:5140 > /tmp/lab14.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          python3 tests/smoke_api.py http://127.0.0.1:5140
      - uses: actions/upload-artifact@v4
        with:
          name: Lab14-publicado
          path: published/
      - name: Deploy to Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error -X POST "$DEPLOY_HOOK" > /dev/null
          else
            echo '::notice::Publicación lista. Configure RENDER_DEPLOY_HOOK para activar el despliegue.'
          fi
